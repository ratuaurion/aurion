# ==============================================================================
# AURION PRODUCTION MAINNET CONFIGURATION TEMPLATE
# Architecture: Single Sovereign Primary Executable (/bin/aurion)
# Invariant: #![forbid(unsafe_code)], Zero-Float exact Quantum (u128)
# ==============================================================================

[network]
name = "aurion-mainnet"
chain_id = 1001
protocol_version = 1
hard_cap_aur = 66000000
genesis_timestamp = 1773532800

[storage]
engine = "redb"
data_dir = "data/aurion.redb"
cache_size_mb = 512
sync_mode = "full_durability"

[p2p]
bind_address = "0.0.0.0:9000"
magic = "AUR0"
max_inbound_peers = 100
max_outbound_peers = 50
min_peer_threshold = 3
wire_frame_max_payload_bytes = 1048576

# Canonical Genesis Validator Bootnodes
bootnodes = [
    "seed1.aurion.network:9000",
    "seed2.aurion.network:9000",
    "seed3.aurion.network:9000",
    "seed4.aurion.network:9000"
]

[rpc]
enabled = true
bind_address = "127.0.0.1:8545"
cors_allowed_origins = ["*"]
max_connections = 1024
max_request_payload_bytes = 524288
rate_limit_requests_per_second = 200

[websocket]
enabled = true
path = "/ws"
max_subscribers = 512

[metrics]
enabled = true
bind_address = "127.0.0.1:9100"
path = "/metrics"

[consensus]
algorithm = "BFT-Single-Slot-Finality"
quorum_threshold_percent = 66.6667
slot_duration_ms = 1000
validator_set_size = 4
block_max_bytes = 1048576
block_max_gas = 10000000

[sentry_node]
enabled = false
validator_upstream_address = "10.0.0.10:9000"
rate_limit_tx_per_sec = 200
rate_limit_sync_per_sec = 50

[mempool]
capacity = 10000
min_fee_per_byte_quanta = 10
rbf_min_fee_hike_percent = 10
expire_after_slots = 300
