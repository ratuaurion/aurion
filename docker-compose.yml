networks:
  aurion-mesh:
    driver: bridge

services:
  val1:
    image: aurion:latest
    container_name: aurion-val1
    networks:
      - aurion-mesh
    ports:
      - "18545:18545"
    volumes:
      - val1-data:/data
    command: >
      validator start --dev --index 0
      --data-dir /data/chain.redb
      --p2p-bind 0.0.0.0:17447
      --rpc-bind 0.0.0.0:18545
      --bootnode tcp/116.212.72.89:7447
      --peer tcp/val2:17447
      --peer tcp/val3:17447
      --peer tcp/val4:17447

  val2:
    image: aurion:latest
    container_name: aurion-val2
    networks:
      - aurion-mesh
    ports:
      - "18546:18546"
    volumes:
      - val2-data:/data
    command: >
      validator start --dev --index 1
      --data-dir /data/chain.redb
      --p2p-bind 0.0.0.0:17447
      --rpc-bind 0.0.0.0:18546
      --bootnode tcp/116.212.72.89:7447
      --peer tcp/val1:17447
      --peer tcp/val3:17447
      --peer tcp/val4:17447

  val3:
    image: aurion:latest
    container_name: aurion-val3
    networks:
      - aurion-mesh
    ports:
      - "18547:18547"
    volumes:
      - val3-data:/data
    command: >
      validator start --dev --index 2
      --data-dir /data/chain.redb
      --p2p-bind 0.0.0.0:17447
      --rpc-bind 0.0.0.0:18547
      --bootnode tcp/116.212.72.89:7447
      --peer tcp/val1:17447
      --peer tcp/val2:17447
      --peer tcp/val4:17447

  val4:
    image: aurion:latest
    container_name: aurion-val4
    networks:
      - aurion-mesh
    ports:
      - "18548:18548"
    volumes:
      - val4-data:/data
    command: >
      validator start --dev --index 3
      --data-dir /data/chain.redb
      --p2p-bind 0.0.0.0:17447
      --rpc-bind 0.0.0.0:18548
      --bootnode tcp/116.212.72.89:7447
      --peer tcp/val1:17447
      --peer tcp/val2:17447
      --peer tcp/val3:17447

  docker-node:
    image: aurion:latest
    container_name: aurion-docker-node
    networks:
      - aurion-mesh
    ports:
      - "18549:8545"
    volumes:
      - docker-node-data:/data
    command: >
      node
      --data-dir /data/node.redb
      --identity-key /data/docker-node.key
      --bootnode tcp/116.212.72.89:7447
      --rpc-bind 0.0.0.0:8545
      --p2p-bind tcp/0.0.0.0:9000
      --locator tcp/docker-wsl-node:9000

volumes:
  val1-data:
  val2-data:
  val3-data:
  val4-data:
  docker-node-data: