[package]
name = "aurion"
version = "1.0.0-rc1"
edition = "2021"
authors = ["Aurion Core Contributors (Ratu)"]
description = "Aurion Sovereign Cryptocurrency & Blockchain Ecosystem (Single Binary)"
license = "MIT OR Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
float_arithmetic = "deny"
cast_precision_loss = "deny"

[dependencies]
blake3 = { version = "1.5", default-features = false }
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "rand_core"] }
bech32 = "0.11"
thiserror = "2.0"
zeroize = "1.8"
hex = "0.4"
zenoh = { version = "1.1", default-features = false, features = ["transport_tcp", "transport_quic"] }
tokio = { version = "1", features = ["full"] }
redb = "4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rpassword = "7.3"

[dev-dependencies]
hex = "0.4"
tempfile = "3"

[[bin]]
name = "aurion"
path = "src/main.rs"

[lib]
name = "aurion"
path = "src/lib.rs"

[[bench]]
name = "protocol_bench"
path = "benches/protocol_bench.rs"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

